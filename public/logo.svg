<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 180" width="100%" height="100%">
  <defs>
    <!-- Background Glass Pill (Optional/Subtle) -->
    <linearGradient id="hPillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Sun Glow Gradient -->
    <radialGradient id="hSunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb703" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#fb8500" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#fb8500" stop-opacity="0"/>
    </radialGradient>

    <!-- Sun Core Gradient -->
    <linearGradient id="hSunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe66d"/>
      <stop offset="40%" stop-color="#ff9e00"/>
      <stop offset="100%" stop-color="#e85d04"/>
    </linearGradient>

    <!-- Sun Orbit Ring Gradient -->
    <linearGradient id="hOrbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd166" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#f77f00" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#d62828" stop-opacity="0"/>
    </linearGradient>

    <!-- Cloud Front Gradient -->
    <linearGradient id="hCloudFrontGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#f0f9ff"/>
      <stop offset="75%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>

    <linearGradient id="hCloudShade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Raindrop Gradient -->
    <linearGradient id="hDropGrad" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Wind Stream Gradient -->
    <linearGradient id="hWindGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="35%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="75%" stop-color="#67e8f9" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#a7f3d0" stop-opacity="0"/>
    </linearGradient>

    <!-- Text Gradient for "WEATHER" -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Badge Gradient -->
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Shadow -->
    <filter id="hShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0284c7" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- ── Left: Emblem (Scaled and Positioned) ── -->
  <g transform="translate(18, 10)">
    <!-- Sun Halo -->
    <circle cx="120" cy="62" r="48" fill="url(#hSunGlow)"/>

    <!-- Solar Orbit Arc -->
    <path d="M 120,20 A 42,42 0 0,1 162,62" fill="none" stroke="url(#hOrbitGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 160,46 A 42,42 0 0,1 162,62" fill="none" stroke="#ffe66d" stroke-width="3" stroke-linecap="round"/>
    <circle cx="162" cy="62" r="2" fill="#fff7ed"/>

    <!-- Core Sun Sphere -->
    <circle cx="120" cy="62" r="28" fill="url(#hSunGrad)"/>
    <ellipse cx="112" cy="51" rx="11" ry="6" transform="rotate(-25 112 51)" fill="#ffffff" opacity="0.45"/>

    <!-- Sparkle -->
    <g transform="translate(148, 32)">
      <path d="M 0,-6 Q 0,0 6,0 Q 0,0 0,6 Q 0,0 -6,0 Q 0,0 0,-6 Z" fill="#ffeaa7"/>
    </g>

    <!-- Back Atmosphere Glow -->
    <path d="M 64,80
             A 20,20 0 0,1 94,64
             A 24,24 0 0,1 133,74
             L 53,74
             A 18,18 0 0,1 64,80 Z"
          fill="#38bdf8" opacity="0.3"/>

    <!-- Main Volumetric Cloud Body -->
    <g filter="url(#hShadow)">
      <path d="M 52,122
               L 132,122
               A 21,21 0 0,0 153,101
               A 19,19 0 0,0 136,82
               A 23,23 0 0,0 116,73
               A 31,31 0 0,0 61,67
               A 27,27 0 0,0 32,99
               A 22,22 0 0,0 52,122 Z"
            fill="url(#hCloudFrontGrad)"/>

      <path d="M 52,122
               L 132,122
               A 21,21 0 0,0 153,101
               C 142,105 112,119 52,122 Z"
            fill="url(#hCloudShade)"/>

      <path d="M 37,94
               A 27,27 0 0,1 61,69
               A 31,31 0 0,1 114,75
               A 23,23 0 0,1 134,84"
            fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    </g>

    <!-- Wind Stream -->
    <path d="M 20,114 C 38,114 48,109 63,109 C 80,109 88,115 108,115 C 130,115 143,105 160,105"
          fill="none" stroke="url(#hWindGrad)" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Raindrops -->
    <g transform="translate(60, 135) rotate(15)">
      <path d="M 0,-8 C 0,-8 4.5,1 4.5,4 A 4.5,4.5 0 0,1 -4.5,4 C -4.5,1 0,-8 0,-8 Z"
            fill="url(#hDropGrad)"/>
    </g>
    <g transform="translate(92, 139) rotate(15)">
      <path d="M 0,-6.5 C 0,-6.5 3.5,0.8 3.5,3.2 A 3.5,3.5 0 0,1 -3.5,3.2 C -3.5,0.8 0,-6.5 0,-6.5 Z"
            fill="url(#hDropGrad)"/>
    </g>
    <g transform="translate(122, 136) rotate(15)">
      <path d="M 0,-5 C 0,-5 2.8,0.6 2.8,2.6 A 2.8,2.8 0 0,1 -2.8,2.6 C -2.8,0.6 0,-5 0,-5 Z"
            fill="url(#hDropGrad)" opacity="0.85"/>
    </g>
  </g>

  <!-- ── Right: Typography & Brand Title ── -->
  <g transform="translate(205, 30)">
    <!-- Brand Title: WEATHER -->
    <text x="0" y="70"
          font-family="system-ui, -apple-system, 'SF Pro Display', 'Inter', Roboto, sans-serif"
          font-size="64"
          font-weight="800"
          letter-spacing="2.5"
          fill="url(#textGrad)">WEATHER</text>

    <!-- Pro / Live Pill Badge -->
    <rect x="368" y="27" width="56" height="24" rx="12" fill="url(#badgeGrad)" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.2"/>
    <circle cx="380" cy="39" r="3.5" fill="#38bdf8"/>
    <text x="390" y="44"
          font-family="system-ui, -apple-system, 'Inter', sans-serif"
          font-size="11"
          font-weight="700"
          letter-spacing="1.2"
          fill="#38bdf8">LIVE</text>

    <!-- Subtitle / Tagline -->
    <text x="4" y="104"
          font-family="system-ui, -apple-system, 'SF Pro Text', 'Inter', Roboto, sans-serif"
          font-size="14"
          font-weight="600"
          letter-spacing="4.5"
          fill="#94a3b8">ACCURATE &amp; REAL-TIME FORECASTS</text>
  </g>
</svg>
