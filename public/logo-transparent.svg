<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 340" width="100%" height="100%">
  <defs>
    <!-- Sun Glow Gradient -->
    <radialGradient id="trSunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb703" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#fb8500" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#fb8500" stop-opacity="0"/>
    </radialGradient>

    <!-- Sun Core Gradient -->
    <linearGradient id="trSunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe66d"/>
      <stop offset="35%" stop-color="#ff9e00"/>
      <stop offset="100%" stop-color="#e85d04"/>
    </linearGradient>

    <!-- Sun Orbit Ring Gradient -->
    <linearGradient id="trOrbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd166" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#f77f00" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#d62828" stop-opacity="0"/>
    </linearGradient>

    <!-- Cloud Back Shadow/Atmosphere Gradient -->
    <linearGradient id="trCloudBackGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Cloud Front Gradient -->
    <linearGradient id="trCloudFrontGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#f0f9ff"/>
      <stop offset="75%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>

    <!-- Cloud Bottom Shading -->
    <linearGradient id="trCloudShade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.32"/>
    </linearGradient>

    <!-- Raindrop Gradient -->
    <linearGradient id="trDropGrad1" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="trDropGrad2" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Wind Stream Gradient -->
    <linearGradient id="trWindGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="35%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="75%" stop-color="#67e8f9" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#a7f3d0" stop-opacity="0"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="trCloudShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0c4a6e" flood-opacity="0.25"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0284c7" flood-opacity="0.18"/>
    </filter>

    <filter id="trSunShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#ea580c" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- ── 1. Solar Elements (Sun & Rays) ── -->
  <g transform="translate(-40, -10)">
    <!-- Sun Ambient Glow -->
    <circle cx="280" cy="115" r="95" fill="url(#trSunGlow)"/>

    <!-- Solar Orbit Arc -->
    <path d="M 280,30 A 85,85 0 0,1 365,115" fill="none" stroke="url(#trOrbitGrad)" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 360,82 A 85,85 0 0,1 365,115" fill="none" stroke="#ffe66d" stroke-width="5.5" stroke-linecap="round"/>
    <circle cx="365" cy="115" r="3.5" fill="#fff7ed"/>

    <path d="M 205,80 A 85,85 0 0,1 258,34" fill="none" stroke="url(#trOrbitGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>

    <!-- Core Sun Sphere -->
    <circle cx="280" cy="115" r="56" fill="url(#trSunGrad)" filter="url(#trSunShadow)"/>
    <ellipse cx="264" cy="94" rx="22" ry="12" transform="rotate(-25 264 94)" fill="#ffffff" opacity="0.45"/>

    <!-- Solar Flare Sparkle -->
    <g transform="translate(338, 55)">
      <path d="M 0,-11 Q 0,0 11,0 Q 0,0 0,11 Q 0,0 -11,0 Q 0,0 0,-11 Z" fill="#ffeaa7"/>
      <circle cx="0" cy="0" r="2" fill="#ffffff"/>
    </g>
  </g>

  <!-- ── 2. Back Atmosphere Depth Layer ── -->
  <g transform="translate(-40, -10)">
    <path d="M 160,154
             A 38,38 0 0,1 220,124
             A 48,48 0 0,1 298,144
             A 36,36 0 0,1 330,184
             L 138,184
             A 35,35 0 0,1 160,154 Z"
          fill="url(#trCloudBackGrad)"/>
  </g>

  <!-- ── 3. Main Volumetric Cloud Body ── -->
  <g transform="translate(-40, -10)" filter="url(#trCloudShadow)">
    <path d="M 140,240
             L 300,240
             A 42,42 0 0,0 342,198
             A 39,39 0 0,0 308,160
             A 46,46 0 0,0 268,142
             A 62,62 0 0,0 158,130
             A 54,54 0 0,0 100,195
             A 45,45 0 0,0 140,240 Z"
          fill="url(#trCloudFrontGrad)"/>

    <!-- Bottom Volume Inset -->
    <path d="M 140,240
             L 300,240
             A 42,42 0 0,0 342,198
             A 39,39 0 0,0 308,160
             C 292,206 232,234 140,240 Z"
          fill="url(#trCloudShade)"/>

    <!-- Top Highlight Crescent -->
    <path d="M 110,184
             A 54,54 0 0,1 158,134
             A 62,62 0 0,1 264,146
             A 46,46 0 0,1 305,164"
          fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- ── 4. Wind Stream Ribbon ── -->
  <g transform="translate(-40, -10)">
    <path d="M 75,224 C 110,224 130,214 160,214 C 195,214 210,226 250,226 C 295,226 320,206 355,206"
          fill="none" stroke="url(#trWindGrad)" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- ── 5. Luminous Weather Droplets ── -->
  <g transform="translate(-40, -10)">
    <!-- Droplet 1 -->
    <g transform="translate(155, 266) rotate(15)">
      <path d="M 0,-15 C 0,-15 8.5,1.5 8.5,8 A 8.5,8.5 0 0,1 -8.5,8 C -8.5,1.5 0,-15 0,-15 Z"
            fill="url(#trDropGrad1)"/>
      <ellipse cx="-2.5" cy="6.5" rx="2" ry="3.2" fill="#ffffff" opacity="0.65"/>
    </g>

    <!-- Droplet 2 -->
    <g transform="translate(220, 274) rotate(15)">
      <path d="M 0,-12 C 0,-12 7,1 7,7 A 7,7 0 0,1 -7,7 C -7,1 0,-12 0,-12 Z"
            fill="url(#trDropGrad2)"/>
      <ellipse cx="-2" cy="5.5" rx="1.6" ry="2.6" fill="#ffffff" opacity="0.65"/>
    </g>

    <!-- Droplet 3 -->
    <g transform="translate(282, 268) rotate(15)">
      <path d="M 0,-10 C 0,-10 5.5,1 5.5,5.5 A 5.5,5.5 0 0,1 -5.5,5.5 C -5.5,1 0,-10 0,-10 Z"
            fill="url(#trDropGrad1)" opacity="0.85"/>
      <ellipse cx="-1.6" cy="4.2" rx="1.3" ry="2" fill="#ffffff" opacity="0.7"/>
    </g>
  </g>
</svg>
